<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>My First Page</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Londrina+Shadow&display=swap"
      rel="stylesheet"
    />
    <script src="script.js"></script>
    <script src="games.js"></script>
    <header>
      <div id="logo">Skill Issue Identifier</div>
      <nav>
        <ul>
          <li>
            <a href="/"><button class="button">Homepage</button></a>
          </li>
          <li>
            <a href="/index2"><button class="button">Page 2!</button></a>
          </li>
          <li>
            <button class="button" id="theme-toggle">Theme Selector!</button>
          </li>
          <li>
            <a href="/valorant_lore_page.html"
              ><button class="button">Val Lore!</button></a
            >
          </li>
          <li>
            <button class="button" id="count-btn">Counter!</button>
            <span id="count-display">0</span>
          </li>
        </ul>
      </nav>
    </header>
  </head>
  <body>
    <div class="wrapping-div">
      <h1>Hi, I'm Joaquin</h1>
      <p>the last 3 games I played were</p>
      <img src="Dog_Breeds.jpg" alt="Beautiful puppy" />
      <form class="form" action="javascript:void(0)">
        <div class="filters">
          <label for="search">Search Games!</label>
          <input type="text" id="search" placeholder="Search for games.." />
          <label for="genre-dropdown">Choose a game Genre!</label>
          <select name="genre" id="genre-dropdown">
            <option value="all">Show all Games!</option>
          </select>
          <label for="store-dropdown">Choose a store!</label>
          <select name="store" id="store-dropdown">
            <option value="all">All stores</option>
          </select>

          <div>
              <label for="max-price" id="price-label">Max price <span id="max-price-display">$70</span>
              </label>
              <input
                  name="max-price"
                  id="max-price"
                  type="range"
                  min="0"
                  max="70"
                  value="70"
              />
          </div>
          <label for="favorites-only">
            <input type="checkbox" id="favorites-only" /> Only show my favorites
          </label>
        </div>

        <div>
          <button class="button" id="random-game">Get a random game!</button>
          <button class="button" id="game-loader">Load Games!</button>
          <div id="list"></div>
        </div>
      </form>
      <a href="/index2"><button class="button">Page 2!</button></a>
    </div>
  </body>
</html>
